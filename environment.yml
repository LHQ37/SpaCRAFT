      - anndata==0.10.5.post1
      - scanpy==1.9.8
      - episcanpy==0.4.0
      - scib==1.1.4
      - leidenalg==0.10.2
      - umap-learn==0.5.5
      - networkx==3.2.1
      - PyYAML==6.0.1
      - Pillow==10.2.0
      - statsmodels==0.14.1
      - gseapy==1.1.2
      - snapatac2==2.6.5
