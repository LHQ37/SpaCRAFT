  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytest
  - pytorch=1.13
  - pytorch-cuda=11.7
  - numpy=1.26
  - pandas=1.5
  - scipy=1.12
  - scikit-learn=1.4
  - matplotlib=3.6
  - seaborn
  - pysam
  - pyfaidx
  - r-base
  - r-dplyr
  - r-tidyr
  - r-tibble
